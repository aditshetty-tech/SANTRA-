<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTRA | Client Sign In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar navbar-expand-lg navbar-light p-0 w-100">
            <div class="container-fluid px-0">
                <div class="brand-logo">
                    <span class="brand-title">Santra</span>
                    <span class="brand-subtitle">Nature Inspired Fashion</span>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#santraNav" aria-controls="santraNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0" id="santraNav">
                    <ul class="nav-links navbar-nav mb-2 mb-lg-0 me-lg-4">
                <li class="nav-item"><a href="index.html">Home</a></li>
                <li class="nav-item"><a href="catalogue.html">Catalogue</a></li>
                <li class="nav-item"><a href="login.html" class="active">Login</a></li>
                <li class="nav-item"><a href="register.html">Register</a></li>
            </ul>
                    <div class="input-group site-search">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="search" class="form-control" placeholder="Search...">
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Client Sign In</h2>
            <p class="auth-subtitle">Access Your Private Account</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="client@santra.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Remember Me
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-luxury">Sign In</button>
            </form>

            <div class="auth-footer">
                New to Santra? <a href="register.html">Create an Account</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p class="copyright">© 2026 Santra Fashion & Fine Books. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
