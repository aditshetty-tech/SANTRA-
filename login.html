<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTRA | Client Sign In</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="site-header">
        <div class="brand-logo">
            <span class="brand-title">Santra</span>
            <span class="brand-subtitle">Nature Inspired Fashion</span>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="catalogue.html">Catalogue</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Client Sign In</h2>
            <p class="auth-subtitle">Access Your Private Account</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="client@santra.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Remember Me
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-luxury">Sign In</button>
            </form>

            <div class="auth-footer">
                New to Santra? <a href="register.html">Create an Account</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p class="copyright">© 2026 Santra Fashion & Fine Books. All Rights Reserved.</p>
    </footer>

</body>
</html>
